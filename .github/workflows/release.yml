name: Release

# Build and publish binaries when a maintainer publishes a GitHub Release.
#
# This is the repository's sole CI workflow. The maintainer creates the tag +
# Release by hand (UI or `gh release create`); this workflow ONLY reacts to that
# publish -- it runs the full gate on the tagged source, cross-compiles the 6
# supported targets, writes a SHA256 checksums file, and uploads them to THAT
# release. It never creates a release itself.
#
# Gated + all-or-nothing: three gate jobs run against the tagged source before
# any binary is built or uploaded --
#   * verify: `go mod tidy` check + `go vet` + `go test` with coverage
#   * lint:   golangci-lint (pinned linter version)
#   * vuln:   govulncheck (the project's `scan` -- there is no container image,
#             so no image/trivy step; matches scripts/dev.sh, which has neither)
# The `release` job `needs` all three, so a failing test, vet, lint, or a known,
# reachable vulnerability blocks the build and upload entirely. The release job
# then builds all six targets before uploading anything (set -euo pipefail + a
# 6-binary assertion), so a failed target never leaves a partial release.
# Uploads use the runner's built-in `gh` CLI -- no third-party action -- keeping
# the supply-chain surface to actions/checkout + actions/setup-go +
# golangci-lint-action only.
#
# Same commands/flags as scripts/dev.sh / scripts/dev.ps1 (local == CI): the
# local equivalent of this workflow is `dev.sh full` (build vet test cov vuln)
# followed by `dev.sh release`. The 6-target list and build flags are shared
# with the dev scripts' `release` task -- keep both in lockstep. Every job
# tracks the toolchain declared in go.mod (go-version-file), so the gate and the
# release binaries use the module's declared Go version.

on:
  release:
    types: [published]

# Least privilege: the token starts with no scopes; the single job opts in to
# contents:write purely to attach assets to the triggering release. Built-in
# GITHUB_TOKEN only -- never a PAT.
permissions: {}

# Serialize publishes for the same tag; never cancel an in-flight upload (a
# cancelled run could leave the release with a partial asset set).
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  # Clean logs + pure-Go static builds, matching the dev scripts.
  NO_COLOR: "1"
  CGO_ENABLED: "0"

jobs:
  # Gate: vet, module tidiness, and the full test suite with coverage, run
  # against the tagged source. Same commands/flags as the dev scripts' vet, test,
  # and cov tasks; any failure blocks the release via `needs` on the `release`
  # job below.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout only
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        # -count=1 disables the test cache so the tagged source is always
        # re-tested in full, matching scripts/dev.sh.
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage total
        run: |
          go tool cover -func=coverage.out | tail -1
          {
            echo "### Release gate coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Gate: golangci-lint on the tagged source. Same action, pinned linter version,
  # and v2 config schema as the dev scripts' lint task (.golangci.yml).
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout only
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pin the linter exactly (supply-chain); v2.12.2 supports Go 1.26.
          # --no-color was removed in v2 -- color is off via the NO_COLOR env.
          version: v2.12.2
          args: ./...

  # Gate: a release must not ship a binary with a known, reachable vulnerability.
  # Same scanner and invocation as the dev scripts' `vuln` task; a finding fails
  # this job and -- via `needs` on `release` below -- blocks build and upload.
  vuln:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout only; no write access needed to scan
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan for known vulnerabilities
        # Non-zero exit on any reachable vulnerability fails the job (and, via
        # needs, the whole release). The vuln DB is fetched fresh each run.
        run: govulncheck ./...

  release:
    needs: [verify, lint, vuln]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach binaries + checksums to the existing release
    steps:
      - name: Check out the release tag
        # On a release event the default ref is the tag, so this checks out the
        # exact tagged source. Pinned to a full commit SHA (supply-chain);
        # persist-credentials:false drops the checkout token afterward (gh uses
        # its own GH_TOKEN below, and no later step needs git credentials).
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        # actions/setup-go pinned to a full commit SHA (supply-chain).
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          # Track the toolchain declared in go.mod so release binaries never
          # drift from the module's required Go version.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cross-compile all targets
        env:
          # The tag reaches the shell ONLY through this env var -- never
          # substituted as ${{ }} into the script body -- so a crafted tag
          # cannot inject shell. It is stamped into main.version verbatim
          # (v-prefixed); use "${TAG#v}" instead for a bare version.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$TAG"
          # Keep this list in lockstep with RELEASE_TARGETS in scripts/dev.sh /
          # scripts/dev.ps1.
          targets=(
            "linux/amd64" "linux/arm64"
            "darwin/amd64" "darwin/arm64"
            "windows/amd64" "windows/arm64"
          )
          mkdir -p dist
          for target in "${targets[@]}"; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/semp-workflow_${os}_${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            echo "==> building ${os}/${arch} -> ${out}"
            GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "$out" ./cmd/semp-workflow
          done

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(semp-workflow_*)
          # Fail loud if any target is missing -- never publish a partial set.
          if [ "${#bins[@]}" -ne 6 ]; then
            echo "expected 6 binaries in dist/, found ${#bins[@]}" >&2
            exit 1
          fi
          # Bare filenames (no dist/ prefix) so `sha256sum -c SHA256SUMS`
          # verifies correctly when run from the download directory.
          sha256sum "${bins[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload binaries + checksums to the release
        env:
          # gh authenticates with the built-in token; contents:write is enough
          # to attach assets to the EXISTING release (it never creates one).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # --clobber overwrites same-named assets, making re-runs idempotent.
          gh release upload "$TAG" dist/semp-workflow_* dist/SHA256SUMS --clobber
