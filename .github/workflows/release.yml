name: Release

# Build and publish binaries when a maintainer publishes a GitHub Release.
#
# The maintainer creates the tag + Release by hand (UI or `gh release create`);
# this workflow ONLY reacts to that publish -- it cross-compiles the 6 supported
# targets, writes a SHA256 checksums file, and uploads them to THAT release. It
# never creates a release itself.
#
# Single job, all-or-nothing: every target is built first, and nothing is
# uploaded unless all six compiled (set -euo pipefail + a 6-binary assertion),
# so a failed target never leaves a partial release. Uploads use the runner's
# built-in `gh` CLI -- no third-party action -- keeping the supply-chain surface
# to actions/checkout + actions/setup-go only.
#
# Shares the 6-target list and build flags with the `release` task in
# scripts/dev.sh / scripts/dev.ps1 and the build matrix in go-ci.yml (keep all
# three in lockstep). The Go toolchain tracks go.mod (go-version-file), so
# release binaries build with the module's declared version. Normal push/PR CI
# (vet, lint, test, cov, vuln, cross-compile smoke) lives in go-ci.yml and is
# NOT duplicated here: that workflow uploads ephemeral per-run artifacts, while
# this one attaches durable assets to the release.

on:
  release:
    types: [published]

# Least privilege: the token starts with no scopes; the single job opts in to
# contents:write purely to attach assets to the triggering release. Built-in
# GITHUB_TOKEN only -- never a PAT.
permissions: {}

# Serialize publishes for the same tag; never cancel an in-flight upload (a
# cancelled run could leave the release with a partial asset set).
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  # Clean logs + pure-Go static builds, matching go-ci.yml and the dev scripts.
  NO_COLOR: "1"
  CGO_ENABLED: "0"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach binaries + checksums to the existing release
    steps:
      - name: Check out the release tag
        # On a release event the default ref is the tag, so this checks out the
        # exact tagged source. Pinned to a full commit SHA (supply-chain);
        # persist-credentials:false drops the checkout token afterward (gh uses
        # its own GH_TOKEN below, and no later step needs git credentials).
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        # actions/setup-go pinned to a full commit SHA (supply-chain).
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          # Track the toolchain declared in go.mod so release binaries never
          # drift from the module's required Go version.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Cross-compile all targets
        env:
          # The tag reaches the shell ONLY through this env var -- never
          # substituted as ${{ }} into the script body -- so a crafted tag
          # cannot inject shell. It is stamped into main.version verbatim
          # (v-prefixed); use "${TAG#v}" instead for a bare version.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$TAG"
          # Keep this list in lockstep with RELEASE_TARGETS in scripts/dev.sh /
          # scripts/dev.ps1 and the build matrix in .github/workflows/go-ci.yml.
          targets=(
            "linux/amd64" "linux/arm64"
            "darwin/amd64" "darwin/arm64"
            "windows/amd64" "windows/arm64"
          )
          mkdir -p dist
          for target in "${targets[@]}"; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/semp-workflow_${os}_${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            echo "==> building ${os}/${arch} -> ${out}"
            GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "$out" ./cmd/semp-workflow
          done

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(semp-workflow_*)
          # Fail loud if any target is missing -- never publish a partial set.
          if [ "${#bins[@]}" -ne 6 ]; then
            echo "expected 6 binaries in dist/, found ${#bins[@]}" >&2
            exit 1
          fi
          # Bare filenames (no dist/ prefix) so `sha256sum -c SHA256SUMS`
          # verifies correctly when run from the download directory.
          sha256sum "${bins[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload binaries + checksums to the release
        env:
          # gh authenticates with the built-in token; contents:write is enough
          # to attach assets to the EXISTING release (it never creates one).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # --clobber overwrites same-named assets, making re-runs idempotent.
          gh release upload "$TAG" dist/semp-workflow_* dist/SHA256SUMS --clobber
