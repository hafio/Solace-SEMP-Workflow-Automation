name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Runs the same vet / lint / test / cov / vuln / build commands as
# scripts/dev.sh (local == CI), plus a go.mod tidiness guard. Graphify is
# omitted (it needs the external graph tool and is a report-only, user-run gate).

env:
  # Keep captured output clean, matching the dev scripts (§8.1).
  NO_COLOR: "1"
  # Pure-Go static builds — mirrors the dev scripts' default and lets one Linux
  # runner cross-compile every target with no C toolchain.
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 1.24.4 is the module's required version (go.mod); stable tracks latest.
        go-version: ["1.24.4", "stable"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        # -count=1 disables the test cache so CI always re-runs the full suite,
        # matching scripts/dev.sh (local == CI).
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage total
        run: |
          go tool cover -func=coverage.out | tail -1
          {
            echo "### Coverage (Go ${{ matrix.go-version }})"
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage profile
        if: matrix.go-version == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profile
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Match go.mod; golangci-lint v1.64.x supports Go 1.24.
          go-version: "1.24.4"
          cache-dependency-path: go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # v1 line: .golangci.yml uses the v1 config schema. Pin exactly (§3).
          version: v1.64.8
          args: --no-color ./...

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  # Cross-compile every supported platform. Same command/flags as the
  # `release` task in scripts/dev.sh (one leg per RELEASE_TARGETS entry).
  # These are ephemeral per-run CI artifacts; durable release assets (the same
  # six binaries plus SHA256SUMS) are published on a GitHub Release by
  # .github/workflows/release.yml, so the two workflows do not overlap.
  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: go.sum

      - name: Build ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" \
            -o "dist/semp-workflow_${{ matrix.target.goos }}_${{ matrix.target.goarch }}${{ matrix.target.ext }}" \
            ./cmd/semp-workflow

      - name: Upload ${{ matrix.target.goos }}/${{ matrix.target.goarch }} binary
        uses: actions/upload-artifact@v4
        with:
          name: semp-workflow_${{ matrix.target.goos }}_${{ matrix.target.goarch }}
          path: dist/semp-workflow_${{ matrix.target.goos }}_${{ matrix.target.goarch }}${{ matrix.target.ext }}
          if-no-files-found: error

  # Functional smoke test on a native binary (can't run cross-compiled ones).
  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: go.sum

      - name: Build (native)
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" \
            -o dist/semp-workflow ./cmd/semp-workflow

      - name: Validate example config (offline)
        run: ./dist/semp-workflow validate --config examples/config.yaml --templates-dir examples/templates

      - name: List modules
        run: ./dist/semp-workflow list-modules
